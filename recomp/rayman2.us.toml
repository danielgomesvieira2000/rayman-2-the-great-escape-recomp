# N64Recomp configuration for Rayman 2: The Great Escape (USA, NUS-NY2E rev 0).
#
# Do not run this file directly. scripts/recompile.sh splices the generated
# `ignored` list into it and runs the recompiler on the result:
#
#     scripts/recompile.sh          -> RecompiledFuncs/*.c
#
# Paths are relative to THIS FILE's directory, not the working directory.

[input]
# VRAM entry point, from the cartridge header at offset 0x8. This is where the
# boot segment is loaded; the other two segments live elsewhere, and the ELF
# carries all three. See docs/PHASE01-FINDINGS.md for the segment map.
entrypoint = 0x80000400

# Symbol-rich, assembly-only ELF assembled from splat output by
# scripts/build-elf.sh. Derived from the builder's own ROM: never committed.
elf_path = "../elf/rayman2.us.elf"

# Per-function C output. Build artifact; git-ignored.
output_func_path = "../RecompiledFuncs"

# No relocatable overlay sections. Phase 01 confirmed the claim that matters:
# the game's three code segments are copied to fixed addresses at boot and are
# never relocated, so there is no overlay/module system to describe here.

[patches]
# Functions emitted as empty stubs.
#
# These touch privileged CPU state that cannot be translated into C, and --
# unlike the cache and interrupt routines named in recomp/symbol_addrs.txt --
# they are NOT in N64Recomp's reimplemented set, so naming them would not hand
# them to the runtime. Stubbing is the remaining option, and it is sound here:
#
#   - The three TLB routines manipulate cop0 EntryHi/EntryLo/Index and issue
#     tlbwi/tlbp. The port has no MMU: librecomp addresses RDRAM flatly, and
#     phase 00 established the game has no TLB-mapped code. There is nothing
#     for them to do. They are left as func_<addr> rather than given guessed
#     libultra names, because their bodies did not prove a specific identity.
#
#   - func_8000C3D0 reads cop0 Cause (register 13) and saves/restores FPU
#     control state across a large handwritten routine with an indirect tail
#     call: an exception handler. A recompiled port has no CPU exceptions for it
#     to service -- librecomp and ultramodern handle that themselves -- so the
#     game's handler is never entered and there is nothing to translate.
#
#   - func_8000CB94 writes cop0 EPC (register 14) alongside Status, and
#     func_8000CA34 tail-calls into it: this is the return-from-exception path
#     belonging to the handler above. Stubbed for the same reason.
#
# __osGetSR / __osSetSR (cop0 Status) are NOT listed here on purpose: they are
# already in N64Recomp's own built-in `ignored_funcs` set, so the recompiler
# drops them without being asked, and naming an already-dropped function in
# `stubs` is a hard error. Naming them in recomp/symbol_addrs.txt is both
# necessary and sufficient.
stubs = [
    "func_80003D40",
    "func_8000CF50",
    "func_80014930",
    "func_8000C3D0",
    "func_8000CB94",
]

# Symbols that look like functions but aren't: data that splat placed in .text
# and labelled with `glabel`, exactly as it labels code. Generated by
# tools/gen_ignored_syms.py from the ELF and spliced in below by
# scripts/recompile.sh -- do not edit the list by hand.
# @IGNORED@

# Single-instruction patches to the target binary.
#
# None are applied. One was, as a diagnostic, and it has been removed now that
# it answered its question -- see docs/PHASE04-FINDINGS.md for the result.
#
# To repeat that experiment (NOP the game's shared assert trap, silencing all
# ten of its call sites at once):
#
#   [[patches.instruction]]
#   func  = "func_8008F86C"
#   vram  = 0x8008F86C
#   value = 0x00000000   # break 255 -> nop
#
# It is deliberately NOT left in place. With the trap disabled the game runs on
# through data it has itself declared invalid, so anything observed afterwards
# may be an artefact of that corrupted state rather than a real finding. A
# diagnostic that quietly becomes permanent is worse than no diagnostic.
