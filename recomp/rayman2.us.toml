# N64Recomp configuration for Rayman 2: The Great Escape (USA, NUS-NY2E rev 0).
#
# Do not run this file directly. scripts/recompile.sh splices the generated
# `ignored` list into it and runs the recompiler on the result:
#
#     scripts/recompile.sh          -> RecompiledFuncs/*.c
#
# Paths are relative to THIS FILE's directory, not the working directory.

[input]
# VRAM entry point, from the cartridge header at offset 0x8. This is where the
# boot segment is loaded; the other two segments live elsewhere, and the ELF
# carries all three. See docs/PHASE01-FINDINGS.md for the segment map.
entrypoint = 0x80000400

# Symbol-rich, assembly-only ELF assembled from splat output by
# scripts/build-elf.sh. Derived from the builder's own ROM: never committed.
elf_path = "../elf/rayman2.us.elf"

# Per-function C output. Build artifact; git-ignored.
output_func_path = "../RecompiledFuncs"

# No relocatable overlay sections. Phase 01 confirmed the claim that matters:
# the game's three code segments are copied to fixed addresses at boot and are
# never relocated, so there is no overlay/module system to describe here.

[patches]
# Functions emitted as empty stubs.
#
# These touch privileged CPU state that cannot be translated into C, and --
# unlike the cache and interrupt routines named in recomp/symbol_addrs.txt --
# they are NOT in N64Recomp's reimplemented set, so naming them would not hand
# them to the runtime. Stubbing is the remaining option, and it is sound here:
#
#   - The three TLB routines manipulate cop0 EntryHi/EntryLo/Index and issue
#     tlbwi/tlbp. The port has no MMU: librecomp addresses RDRAM flatly, and
#     phase 00 established the game has no TLB-mapped code. There is nothing
#     for them to do. They are left as func_<addr> rather than given guessed
#     libultra names, because their bodies did not prove a specific identity.
#
#   - func_8000C3D0 reads cop0 Cause (register 13) and saves/restores FPU
#     control state across a large handwritten routine with an indirect tail
#     call: an exception handler. A recompiled port has no CPU exceptions for it
#     to service -- librecomp and ultramodern handle that themselves -- so the
#     game's handler is never entered and there is nothing to translate.
#
#   - func_8000CB94 writes cop0 EPC (register 14) alongside Status, and
#     func_8000CA34 tail-calls into it: this is the return-from-exception path
#     belonging to the handler above. Stubbed for the same reason.
#
# __osGetSR / __osSetSR (cop0 Status) are NOT listed here on purpose: they are
# already in N64Recomp's own built-in `ignored_funcs` set, so the recompiler
# drops them without being asked, and naming an already-dropped function in
# `stubs` is a hard error. Naming them in recomp/symbol_addrs.txt is both
# necessary and sufficient.
stubs = [
    "func_80003D40",
    "func_8000CF50",
    "func_80014930",
    "func_8000C3D0",
    "func_8000CB94",
]

# Symbols that look like functions but aren't: data that splat placed in .text
# and labelled with `glabel`, exactly as it labels code. Generated by
# tools/gen_ignored_syms.py from the ELF and spliced in below by
# scripts/recompile.sh -- do not edit the list by hand.
# @IGNORED@

# Single-instruction patches to the target binary.
#
# None are applied. One was, as a diagnostic, and it has been removed now that
# it answered its question -- see docs/PHASE04-FINDINGS.md for the result.
#
# To repeat that experiment (NOP the game's shared assert trap, silencing all
# ten of its call sites at once):
#
#   [[patches.instruction]]
#   func  = "func_8008F86C"
#   vram  = 0x8008F86C
#   value = 0x00000000   # break 255 -> nop
#
# It is deliberately NOT left in place. With the trap disabled the game runs on
# through data it has itself declared invalid, so anything observed afterwards
# may be an artefact of that corrupted state rather than a real finding. A
# diagnostic that quietly becomes permanent is worse than no diagnostic.

# ---------------------------------------------------------------------------
# Function text hooks.
#
# None are active. N64Recomp's FunctionTextHook splices literal C into its own
# generated output, where `rdram` and `ctx` are already in scope -- no MIPS
# cross-compilation, no separate ELF, no reference symbol tables. It is by far
# the cheapest way to ask the running game a question.
#
#   

#   func = "func_800004C0"
#   before_vram = 0x800006A4
#   text = "rayman2_debug_flag(rdram, 0x800250D8u, (uint32_t)ctx->r2);"
#
# The helpers these call live in src/debug_node.cpp and are declared in
# include/port_runtime.h, which is force-included into every generated source --
# that is what makes injected text compile.
#
# Two cautions learned from using them:
#
#   - `before_vram` must be the address of an instruction the path actually
#     reaches. A hook on a plausible-looking site that never executes is
#     indistinguishable from a hook that does not work.
#   - A hook inside a loop runs at loop frequency. The one above sat in the boot
#     thread's idle spin and dominated a profile completely once the thread
#     started idling correctly.
# ---------------------------------------------------------------------------


# Put the main and aux sections into librecomp's function map at the addresses
# they actually occupy.
#
# This is the one hook the port needs in normal operation; every other hook in
# this file during phase 04 was a probe and has been removed now that it has
# answered. It must run on the game thread and after the runtime's init(),
# which clears the map and refills it from the IPL3 window alone, getting two
# of the three sections wrong. The boot thread's entry is the first point that
# satisfies both. See src/register_sections.cpp for the full reasoning.
[[patches.hook]]
func = "func_80000854"
at_func_start = true
text = "rayman2_register_static_sections();"

# Give the scheduler a turn inside the graphics init's busy-wait.
#
# func_8008F344 spins on a byte that only the worker thread at func_8008EF78
# clears, and that worker is blocked in osRecvMesg. ultramodern reschedules and
# delivers external events only inside message-queue calls, and this loop makes
# none -- measured, it turned 519 million times in fourteen seconds while the
# worker ran 21 times and stopped. See src/spin_yield.cpp.
[[patches.hook]]
func = "func_8008F344"
before_vram = 0x8008F354
text = "rayman2_yield_in_spin(rdram);"

# The same busy-wait, in the other place it appears.
#
# tools/find_spin_loops.py ranks call-free waits by length, and the two shortest
# in the whole game are this and func_8008F344 above -- four instructions each,
# both spinning on D_800C8D10 through the same leaf. This one has not been
# reached yet; it is patched now because it is the identical defect and finding
# it again the hard way would be a waste.
[[patches.hook]]
func = "func_800FADC8"
before_vram = 0x800FB018
text = "rayman2_yield_in_spin(rdram);"

# The idle thread is the pump of last resort, and it never yields.
#
# libultra's idle thread may spin because interrupts fire regardless of what is
# running. ultramodern has no interrupts: VI retrace, RSP and RDP completion are
# queued from outside and delivered only inside osSendMesg, osRecvMesg and
# osJamMesg. This loop -- func_800004C0, priority 0 -- calls only func_8008F86C,
# which reaches none of those, so while it runs nothing is delivered.
#
# That is fine while some other thread is runnable, and fatal the moment none
# is. Rayman 2's frame handshake ends in exactly that state: the producer blocks
# waiting for the free framebuffer that the RDP completion will return, every
# other thread is parked, and the idle thread spins. The completion message was
# measured being enqueued with the right queue and the right value, and then
# never dequeued by any of the three consumers -- because the only thread left
# running could not reach one. One display list, ever.
[[patches.hook]]
func = "func_800004C0"
before_vram = 0x8000069C
text = "rayman2_yield_in_spin(rdram);"

# The inner half of the same loop.
#
# 0x800006A4 is `bne $v0, $s0, .L800006A4` -- a branch to itself over a register
# that the body never reloads. If it is ever taken the thread spins there
# forever and the outer hook above never runs again, so the pump has to be in
# both halves.
[[patches.hook]]
func = "func_800004C0"
before_vram = 0x800006A4
text = "rayman2_yield_in_spin(rdram);"

# The wait that sat between the game and a steady frame rate.
#
# func_8008FAF8 is two back-to-back busy-waits with no calls at all:
#
#     while (D_800CE2C4 != 0) { }   // the display-list queue must drain
#     while (D_800EFE70 != 1) { }   // and a flag must be set
#
# Both branches target the function's own entry, so one hook at 0x8008FAF8
# covers both. The thread sampler found it -- 147 of ~170 in-code samples sat
# here -- after hand-placed probes had chased it through four levels of call
# chain without pinning it.
#
# It also exposed two blind spots in tools/find_spin_loops.py, both now fixed:
# the branch target is a function label rather than a local ".L" one, and the
# globals are dereferenced through a register whose address was materialised by
# lui/addiu, so the load carries no %lo for the scanner to see.
[[patches.hook]]
func = "func_8008FAF8"
before_vram = 0x8008FAF8
text = "rayman2_yield_in_spin(rdram);"

# The two-second wait at the top of the game's main.
#
# main spins on osGetTime until roughly two seconds of OSTime have passed. It
# does terminate -- the clock advances on its own -- so this is not a deadlock,
# but while it runs nothing drains the external queue, so VI retrace, audio and
# DMA completion are all held up for as long as it lasts. A yield costs nothing
# in a loop that is waiting for wall-clock time by definition.
[[patches.hook]]
func = "func_80025D30"
before_vram = 0x80025E14
text = "rayman2_yield_in_spin(rdram);"

