# RSPRecomp configuration for Rayman 2's audio microcode.
#
# The addresses come from the OSTask the game hands to osSpTaskLoad, reported
# once by src/rsp.cpp. The task is type 2 (M_AUDTASK) and its microcode lives in
# the boot segment, which phase 01 mapped as ROM 0x1000 -> VRAM 0x80000400, so
# a VRAM address maps back to the ROM by subtracting 0x80000400 and adding
# 0x1000:
#
#   ucode_boot  0x80017D90  size 0x00D0  -> ROM 0x18990   (shared)
#   ucode       0x80017E60  size 0x1000  -> ROM 0x18A60
#   ucode_data  0x8001BBA0  size 0x0800  -> ROM 0x1C7A0
#
# The declared sizes are nominal. Logging the graphics task alongside shows its
# microcode at 0x80018C80 and its data at 0x8001BE60, immediately after the
# audio ones, so both 0x1000 and 0x800 overrun into F3DEX:
#
#   0x80017D90  shared ucode_boot          0x00D0
#   0x80017E60  audio text                 0x0E20  <- ends where graphics begins
#   0x80018C80  graphics text (F3DEX.NoN 1.23)
#   0x8001BBA0  audio data                 0x02C0
#   0x8001BE60  graphics data (carries the F3DEX version string at +0x2B0)
#
# Recompiling the nominal 0x1000 walked into F3DEX and stopped on its DPC_CURRENT
# reads at +0xEEC and +0xF00 -- an "Unhandled mfc0: 10" that was a symptom of the
# wrong length, not of an unsupported instruction. The real extent is 0xE20.
#
# text_address is where the RSP runs it, and it is NOT the start of IMEM.
#
# Disassembling the shared boot stub settles it. rspboot is itself loaded at
# IMEM 0x1000 and does:
#
#   0x1008  lw   $v0, 0x10($at)        ; task.ucode      ($at = 0xFC0)
#   0x100C  addi $v1, $zero, 0xF7F     ; length - 1
#   0x1010  addi $a3, $zero, 0x1080    ; IMEM destination
#   0x1014  mtc0 $a3, SP_MEM_ADDR
#   0x1018  mtc0 $v0, SP_DRAM_ADDR
#   0x101C  mtc0 $v1, SP_RD_LEN
#   0x1034  jr   $a3                   ; and enter it there
#
# So the microcode is loaded at 0x04001080 and entered at 0x04001080, leaving
# the first 0x80 bytes of IMEM to the boot stub. Recompiling it as though it
# began at 0x04001000 put every label 0x80 bytes away from the address the
# jumps actually use, so control flow went to the wrong place immediately: the
# first `jal` landed in the middle of a DMA helper and the command loop then
# dispatched on microcode constants instead of an audio command list.
text_offset          = 0x18A60
text_size            = 0xE20
text_address         = 0x04001080
rom_file_path        = "/mnt/c/Users/Daniel/claude-projects/n64recomp_rayman_2_greate_escape/rom.z64"
output_file_path     = "/mnt/c/Users/Daniel/claude-projects/n64recomp_rayman_2_greate_escape/RecompiledRsp/rsp_audio.cpp"
output_function_name = "rayman2_rsp_audio"

# The command dispatch table, which no static scan can find.
#
# The microcode reads a command word from DMEM, takes the index from bits 30..24
# doubled, and `jr`s through a table of sixteen halfwords living in ucode_data at
# +0x10. The targets are therefore data, not code, and RSPRecomp cannot discover
# them by following branches -- it reported the first one it reached, 0x12D0, as
# an unhandled jump target. All sixteen are listed here, read straight out of the
# ROM at 0x1C7B0, and every one lands inside the microcode's IMEM range of
# 0x1080..0x1EA0, which is the check that they are really code addresses.
extra_indirect_branch_targets = [
    0x1118,
    0x1470,
    0x11DC,
    0x1B38,
    0x1214,
    0x187C,
    0x1254,
    0x12D0,
    0x12EC,
    0x1328,
    0x140C,
    0x1294,
    0x1E24,
    0x138C,
    0x170C,
    0x144C
]
